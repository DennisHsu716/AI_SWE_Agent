name: SWE Agent

on:
  schedule:
    # 每 30 分鐘檢查一次 target repo 有沒有新的待處理 issue。
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: swe-agent
  cancel-in-progress: false

env:
  TARGET_REPO: DennisHsu716/job-scraper
  LABEL_TODO: auto-fix
  LABEL_IN_PROGRESS: swe-agent-in-progress
  LABEL_NEEDS_HUMAN: swe-agent-needs-human
  # 想換模型（例如這個模型撞到能力不夠、或 Groq 把它下架了）
  # 改這裡就好，不用動 scripts/run_agent.py。
  AIDER_MODEL: groq/openai/gpt-oss-120b

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12，不是跟 job-scraper 一樣的 3.13——本機測試時 3.13 上
          # aider-chat 的某個依賴（numpy 舊版 sdist）build 失敗，3.12 上
          # 有現成 wheel 可用，風險比較低。job-scraper 自己的 requirements-dev.txt
          # 另外用 pip install 裝，不受這裡的版本影響。
          python-version: "3.12"

      - name: Install aider-chat
        run: pip install aider-chat

      - name: Find oldest unprocessed issue
        id: pick
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          issue=$(gh issue list --repo "$TARGET_REPO" \
            --label "$LABEL_TODO" \
            --state open \
            --json number,title,body,createdAt \
            --jq 'sort_by(.createdAt) | .[0]')
          if [ -z "$issue" ] || [ "$issue" = "null" ]; then
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_issue=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$issue" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$issue" | jq -r .title)" >> "$GITHUB_OUTPUT"
          echo "$issue" | jq -r .body > issue_body.md

      - name: Mark issue in-progress
        if: steps.pick.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
            --add-label "$LABEL_IN_PROGRESS" --remove-label "$LABEL_TODO"

      - name: Checkout target repo
        if: steps.pick.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          git checkout -b "swe-agent/issue-${ISSUE_NUMBER}"
          git config user.name "swe-agent-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Install target repo dev dependencies
        if: steps.pick.outputs.has_issue == 'true'
        run: pip install -r target/requirements-dev.txt

      - name: Run SWE Agent
        id: agent
        if: steps.pick.outputs.has_issue == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 用環境變數傳遞，不要直接把 ${{ }} 代入下面的 shell 指令字串——
          # 2026-09 實測過：issue 標題只要包含雙引號（例如標題裡引用了一段
          # 原文 "onsite in the US"），直接字串代入會把 shell 的引號結構
          # 打斷，run_agent.py 收到破碎的參數直接被 argparse 拒絕。更嚴重的
          # 是這種寫法本身是已知的 GitHub Actions script injection 手法——
          # issue 標題是外部可控的輸入，直接代入 run: 腳本等於讓任何能開
          # issue 的人有機會在 runner 裡塞任意 shell 指令、拿到裡面的
          # secrets。改成 env 變數，走 bash 正常的變數展開，不會被當成
          # shell 語法重新解析。
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
        run: |
          set +e
          python3 scripts/run_agent.py \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-body-file issue_body.md \
            --repo-dir target
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Open PR (success)
        if: steps.pick.outputs.has_issue == 'true' && steps.agent.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
        run: |
          cd target
          git add -A
          git commit -m "fix: resolve #${ISSUE_NUMBER} (${ISSUE_TITLE})

          Co-Authored-By: swe-agent-bot <actions@users.noreply.github.com>"
          git push origin "swe-agent/issue-${ISSUE_NUMBER}"
          gh pr create --repo "$TARGET_REPO" \
            --title "fix: ${ISSUE_TITLE} (closes #${ISSUE_NUMBER})" \
            --body-file ../agent_summary.md \
            --head "swe-agent/issue-${ISSUE_NUMBER}" \
            --base main
          gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
            --remove-label "$LABEL_IN_PROGRESS"

      - name: Mark needs-human (no changes / failed / unexpected error)
        # always()：之前這裡沒有這個，2026-09 實測過一次——「Install target
        # repo dev dependencies」那步本身失敗（不是 agent 修改/測試失敗），
        # 導致 job 狀態變成 failure，這步跟 Open PR 那步的預設條件都隱含要求
        # 前面 success()，兩個都被跳過，issue 就卡在 swe-agent-in-progress
        # 再也沒人處理。加 always() 讓這步不管前面是不是失敗都會跑，確保
        # 每次「有撿到 issue」的 run 最後一定會有個交代，不會卡死。
        if: always() && steps.pick.outputs.has_issue == 'true' && steps.agent.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f agent_summary.md ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
              --body-file agent_summary.md
          else
            # agent_summary.md 不存在代表根本沒跑到「Run SWE Agent」那步，
            # 是更早的步驟本身出錯（例如裝依賴失敗），附上這次 run 的 log 連結。
            gh issue comment "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
              --body "SWE Agent 這次執行中途發生非預期錯誤（pipeline 本身某個步驟失敗，不是 agent 修改/測試的問題），詳見 log：${RUN_URL}"
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
            --remove-label "$LABEL_IN_PROGRESS" --add-label "$LABEL_NEEDS_HUMAN"
